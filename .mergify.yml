merge_queue:
  max_parallel_checks: 2

queue_rules:
  - name: default
    batch_size: 4
    batch_max_wait_time: "60 seconds"
    max_checks_retries: 0
    queue_conditions:
      - label = queue
    merge_conditions:
      - check-success = all-greens

pull_request_rules:
  - name: queue on label
    conditions:
      - base = main
      - label = queue
    actions:
      queue:
