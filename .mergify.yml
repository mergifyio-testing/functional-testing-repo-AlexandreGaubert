queue_rules:
  - name: default
    batch_size: 2
    batch_max_wait_time: "10 seconds"
    max_checks_retries: 1
    queue_conditions:
      - label = queue
    merge_conditions:
      - check-success = unit-tests

pull_request_rules:
  - name: queue on label
    conditions:
      - base = main
      - label = queue
    actions:
      queue:
  - name: MRGFY-9866 proof, never fires
    conditions:
      - label = ag-9866-never-set
    actions:
      squash:
        commit_message: first-commit

commands_restrictions:
  rebase:
    conditions:
      - sender-permission >= write
  squash:
    conditions:
      - sender = nobody-ag-9866
