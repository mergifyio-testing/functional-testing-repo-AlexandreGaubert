queue_rules:
  - name: default
    merge_conditions:
      - check-success = proof-gate-6802

pull_request_rules:
  - name: queue hotfixes
    conditions:
      - label = hotfix
    actions:
      label:
        add:
          - hotfix-queued
merge_protections_settings:
  auto_merge_conditions:
    - or:
        - and:
            - base = main
            - label = queue
        - label = hotfix
