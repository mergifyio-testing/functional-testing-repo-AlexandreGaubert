name: leg-e2e

# MRGFY-8629 end-to-end proof: a two-OS matrix collecting the same tests, run
# only on merge-queue drafts, with the pytest-mergify build under test talking
# to a local engine.
on:
  pull_request:

jobs:
  leg-tests:
    if: contains(github.head_ref, 'merge-queue')
    strategy:
      fail-fast: ${{ vars.LEG_FAIL_FAST != 'false' }}
      matrix:
        os: [ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest and the pytest-mergify under test
        shell: bash
        run: |
          if [ "${{ vars.LEG_PLUGIN }}" = "published" ]; then
            pip install pytest pytest-mergify
          else
            case "$RUNNER_OS" in
              Linux) wheel="${{ vars.LEG_WHEEL_LINUX }}" ;;
              macOS) wheel="${{ vars.LEG_WHEEL_MAC }}" ;;
            esac
            pip install pytest "${{ vars.LEG_PKG_URL }}/$wheel"
          fi
          pip show pytest-mergify | grep -i '^version'
      - name: Run tests
        shell: bash
        env:
          MERGIFY_TOKEN: ${{ secrets.MERGIFY_TOKEN }}
          MERGIFY_API_URL: ${{ vars.MERGIFY_API_URL }}
          MERGIFY_TEST_SELECTION_ENABLE: "true"
        run: |
          echo "head_ref=$GITHUB_HEAD_REF head_sha=$(jq -r .pull_request.head.sha "$GITHUB_EVENT_PATH") run=$GITHUB_RUN_ID attempt=$GITHUB_RUN_ATTEMPT orch=$ACTIONS_ORCHESTRATION_ID"
          python -m pytest leg -v -p no:cacheprovider

  # When both legs must report before the batch is judged (fail-fast off), the
  # queue waits on this job rather than on each leg.
  all-greens:
    if: always() && contains(github.head_ref, 'merge-queue')
    needs: leg-tests
    runs-on: ubuntu-latest
    steps:
      - run: '[ "${{ needs.leg-tests.result }}" = success ]'
