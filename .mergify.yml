pull_request_rules:
  - name: queue on label
    conditions:
      - base = main
      - label = queue
    actions:
      queue:
merge_protections:
  # Migrated from the `merge` action of rule 'automatic merge': without the
  # merge queue, auto-merge only merges pull requests a rule applies to.
  - name: automatic merge
    if:
      - base = main
      - label = automerge
    success_conditions: []
merge_protections_settings:
  auto_merge_conditions:
    - base = main
    - label = automerge
