queue_rules:
  - name: default
    merge_conditions:
      - check-success = proof-gate-6802

pull_request_rules:
  - name: queue on label
    conditions:
      - base = main
      - label = queue
    actions:
      queue:
  - name: queue hotfixes
    conditions:
      - label = hotfix
    actions:
      queue:
      label:
        add:
          - hotfix-queued
