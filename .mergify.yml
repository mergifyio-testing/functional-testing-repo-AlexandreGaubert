# The `queue` action of rule 'queue on label' was removed without a replacement: Workflow Automation is not enabled on this repository, so the rule never ran.
queue_rules:
  - name: default
    batch_size: 2
    batch_max_wait_time: "10 seconds"
    max_checks_retries: 1
    queue_conditions:
      - label = queue
    merge_conditions:
      - check-success = unit-tests

