defaults:
  actions:
    queue:
      name: main

queue_rules:
  - name: main
    queue_conditions:
      - base = main
    merge_conditions:
      - check-success = proof-gate-6802
  - name: other
    merge_conditions:
      - check-success = proof-gate-6802

pull_request_rules:
  - name: queue on label
    conditions:
      - base = main
      - label = queue
    actions:
      queue: {}
